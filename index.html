<style>
/* Layout: sticky masthead + city tab strip; each tab is a wire-style list of stories (date column, headline, one-line summary, source). */
:root {
  --bg: #f2f5f4;
  --surface: #ffffff;
  --fg: #12201f;
  --muted: #55696a;
  --line: #d3dcdb;
  --accent: #0b6a73;
  --accent-ink: #ffffff;
  --signal: #b4570a;
  --signal-bg: #fbe9d6;
  --font-display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1717; --surface: #152221; --fg: #e3ecea; --muted: #8fa5a4; --line: #263938;
    --accent: #55c2c9; --accent-ink: #062a2d; --signal: #f0a15a; --signal-bg: #3a2814;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1717; --surface: #152221; --fg: #e3ecea; --muted: #8fa5a4; --line: #263938;
  --accent: #55c2c9; --accent-ink: #062a2d; --signal: #f0a15a; --signal-bg: #3a2814;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { color-scheme: light; }
body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
.wrap { max-width: 860px; margin: 0 auto; }
header.mast { padding-block: 28px 14px; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 24px; }
h1 {
  font-family: var(--font-display); font-weight: 700; font-size: clamp(2rem, 6vw, 2.9rem);
  line-height: 1; letter-spacing: 0.01em; text-transform: uppercase; margin: 0; text-wrap: balance;
}
h1 span { color: var(--accent); }
.stamp { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); margin: 0; }
.tabbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--bg); border-bottom: 2px solid var(--fg);
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding-inline: max(16px, env(safe-area-inset-left, 0px));
}
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; max-width: 860px; margin: 0 auto; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a {
  flex: none; text-decoration: none; color: var(--muted);
  padding: 8px 14px 7px; display: flex; flex-direction: column; gap: 0;
  border-bottom: 4px solid transparent; margin-bottom: -2px;
}
.tabs a small { font-family: var(--font-mono); font-size: 0.64rem; letter-spacing: 0.08em; line-height: 1.1; }
.tabs a b { font-family: var(--font-display); font-weight: 600; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 0.04em; line-height: 1.15; }
.tabs a:hover { color: var(--fg); }
.tabs a[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tabs a:focus-visible, .story a:focus-visible, .links a:focus-visible, .more:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.panel { padding-top: 22px; }
.panel-head { display: flex; flex-wrap: wrap; gap: 6px 20px; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.panel-head h2 { font-family: var(--font-display); font-size: 1.9rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; margin: 0; line-height: 1.1; }
.panel-head p { margin: 0; color: var(--muted); font-size: 0.92rem; max-width: 52ch; min-width: 0; }
.links { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 6px 0 14px; font-size: 0.86rem; }
.links a { color: var(--accent); text-underline-offset: 3px; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-top: 2px solid var(--fg); margin-top: 28px; padding-top: 6px; }
.section-head h3 { font-family: var(--font-display); font-size: 1.35rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; margin: 0; }
.section-head h3 small { font-family: var(--font-mono); font-size: 0.68rem; color: var(--muted); letter-spacing: 0.08em; margin-left: 8px; font-weight: 400; }
.more { color: var(--accent); font-size: 0.86rem; text-underline-offset: 3px; white-space: nowrap; }
.story { display: grid; grid-template-columns: 5.2rem minmax(0, 1fr); gap: 4px 14px; padding: 13px 0; border-bottom: 1px solid var(--line); }
.when { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); padding-top: 4px; }
.when.today { color: var(--signal); font-weight: 500; }
.story h4 { margin: 0; font-size: 1.06rem; font-weight: 600; line-height: 1.32; text-wrap: balance; }
.story h4 a { color: var(--fg); text-decoration: none; background-image: linear-gradient(var(--accent), var(--accent)); background-size: 0 2px; background-position: 0 100%; background-repeat: no-repeat; transition: background-size .18s; }
.story h4 a:hover { background-size: 100% 2px; }
.story p { margin: 3px 0 0; color: var(--muted); font-size: 0.92rem; max-width: 66ch; }
.src { margin-top: 5px; font-size: 0.78rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.src .name { font-family: var(--font-mono); font-size: 0.74rem; }
.tag { font-size: 0.68rem; padding: 1px 7px; border: 1px solid var(--line); border-radius: 3px; background: var(--surface); }
.tag.pay { color: var(--signal); border-color: var(--signal); background: var(--signal-bg); }
.tag.off { color: var(--accent); border-color: var(--accent); }
.empty { color: var(--muted); padding: 24px 0; }
footer { margin-top: 44px; border-top: 2px solid var(--fg); padding-top: 12px; color: var(--muted); font-size: 0.84rem; display: grid; gap: 6px; }
footer p { margin: 0; max-width: 72ch; }
@media (max-width: 520px) {
  .story { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .when { padding-top: 0; }
}
@media (prefers-reduced-motion: reduce) { .story h4 a { transition: none; } }

.article-view {max-width:760px;margin:0 auto;padding:16px 0 35px}
.back-link {display:inline-block;color:var(--accent);font-size:.9rem;margin:0 0 24px;text-decoration:none}
.article-view h2 {font-family:var(--font-display);font-size:clamp(2.2rem,6vw,3.7rem);line-height:1.05;margin:10px 0 18px}
.article-meta {color:var(--muted);font-family:var(--font-mono);font-size:.78rem;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:22px}
.article-lead {font-size:1.16rem;line-height:1.7;color:var(--fg)}
.article-copy {font-size:1.04rem;line-height:1.85;white-space:pre-line}
.article-figure {margin:24px 0}.article-figure img {width:100%;max-height:440px;object-fit:cover;border-radius:5px}
.article-figure figcaption {font-size:.75rem;color:var(--muted)}
.article-sources {border-top:2px solid var(--fg);margin-top:32px;padding-top:16px}
.article-sources a {color:var(--accent);overflow-wrap:anywhere}
.story h4 a {cursor:pointer}
</style>

<script>
(function () {
  var data = JSON.parse(document.getElementById('news-data').textContent);
  var tabsEl = document.getElementById('tabs');
  var panel = document.getElementById('panel');

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  document.getElementById('stamp').textContent = 'Norfolk & Suffolk news · Updated ' + data.updated;

  var ids = ['all'].concat(data.cities.map(function (c) { return c.id; }));

  function buildTabs(active) {
    tabsEl.textContent = '';
    var all = el('a'); all.href = '#all'; all.setAttribute('role', 'tab');
    all.setAttribute('aria-selected', active === 'all');
    all.appendChild(el('small', null, 'NFK + SFK')); all.appendChild(el('b', null, 'All'));
    tabsEl.appendChild(all);
    data.cities.forEach(function (c) {
      var a = el('a'); a.href = '#' + c.id; a.setAttribute('role', 'tab');
      a.setAttribute('aria-selected', active === c.id);
      a.appendChild(el('small', null, c.county)); a.appendChild(el('b', null, c.name));
      tabsEl.appendChild(a);
    });
  }

  function story(item) {
    var row = el('article', 'story');
    row.appendChild(el('div', 'when' + (item.when === 'today' || item.when === 'tonight' ? ' today' : ''), item.when));
    var body = el('div');
    var h = el('h4'); var a = el('a', null, item.title);
    a.href = '#article/' + encodeURIComponent(item._city || '') + '/' + encodeURIComponent(item._index); h.appendChild(a);
    body.appendChild(h);
    if (item.summary) body.appendChild(el('p', null, item.summary));
    var src = el('div', 'src');
    if (item.official) src.appendChild(el('span', 'tag off', 'official release'));
    if (item.paywall) src.appendChild(el('span', 'tag pay', 'subscription'));
    body.appendChild(src);
    row.appendChild(body);
    return row;
  }

  function sourceLinks(city) {
    var box = el('div', 'links');
    city.sources.forEach(function (s) {
      var a = el('a', null, s.label + ' ↗'); a.href = s.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
      box.appendChild(a);
    });
    return box;
  }

  function renderCity(city) {
    panel.textContent = '';
    var head = el('div', 'panel-head');
    head.appendChild(el('h2', null, city.name));
    head.appendChild(el('p', null, city.blurb));
    panel.appendChild(head);
    panel.appendChild(sourceLinks(city));
    if (!city.items.length) { panel.appendChild(el('p', 'empty', 'No new stories for this town today.')); return; }
    city.items.forEach(function (it, i) { it._city = city.id; it._index = i; panel.appendChild(story(it)); });
  }

  function renderAll() {
    panel.textContent = '';
    var head = el('div', 'panel-head');
    head.appendChild(el('h2', null, 'Today at a glance'));
    head.appendChild(el('p', null, 'The three latest stories for each town. Select a town to see all of its news.'));
    panel.appendChild(head);
    data.cities.forEach(function (c) {
      var sh = el('div', 'section-head');
      var h3 = el('h3', null, c.name); h3.appendChild(el('small', null, c.county));
      sh.appendChild(h3);
      var more = el('a', 'more', 'All ' + c.items.length + ' stories →'); more.href = '#' + c.id;
      sh.appendChild(more);
      panel.appendChild(sh);
      c.items.slice(0, 3).forEach(function (it, i) { it._city = c.id; it._index = i; panel.appendChild(story(it)); });
    });
  }

  function renderArticle(city, item) {
    panel.textContent = '';
    var article = el('article', 'article-view');
    var back = el('a', 'back-link', '← Back to ' + city.name);
    back.href = '#' + city.id; article.appendChild(back);
    article.appendChild(el('div', 'stamp', city.name.toUpperCase() + ' / ' + city.county));
    article.appendChild(el('h2', null, item.title));
    article.appendChild(el('div', 'article-meta', item.when + (item.official ? ' · official release' : '') + (item.paywall ? ' · subscription source' : '')));
    if (item.image && item.imageLicence) {
      var fig = el('figure', 'article-figure');
      var img = el('img'); img.src = item.image; img.alt = item.imageAlt || ''; img.loading = 'lazy';
      fig.appendChild(img);
      fig.appendChild(el('figcaption', null, item.imageCredit || item.imageLicence));
      article.appendChild(fig);
    }
    if (item.summary) article.appendChild(el('p', 'article-lead', item.summary));
    if (item.body) article.appendChild(el('div', 'article-copy', item.body));
    else article.appendChild(el('p', 'article-copy', 'This is a short briefing based on the information currently verified. Further details will be added when reliable sources are available.'));
    var sources = el('div', 'article-sources');
    sources.appendChild(el('h3', null, 'Sources'));
    var links = Array.isArray(item.sources) && item.sources.length ? item.sources : [{label:item.source,url:item.url}];
    links.forEach(function (source) {
      if (!source.url || !/^https:\/\//.test(source.url)) return;
      var p = el('p'); var a = el('a', null, source.label || 'Read original source');
      a.href = source.url; a.target = '_blank'; a.rel = 'noopener noreferrer'; p.appendChild(a); sources.appendChild(p);
    });
    article.appendChild(sources); panel.appendChild(article);
  }

  function route() {
    var h = (location.hash || '').replace('#', '');
    if (h.indexOf('article/') === 0) {
      var parts = h.split('/');
      var city = data.cities.find(function (c) { return c.id === decodeURIComponent(parts[1] || ''); });
      var idx = Number(parts[2]);
      if (city && Number.isInteger(idx) && idx >= 0 && idx < city.items.length) {
        buildTabs(city.id); renderArticle(city, city.items[idx]); window.scrollTo(0,0); return;
      }
    }
    if (ids.indexOf(h) === -1) h = 'all';
    buildTabs(h);
    if (h === 'all') renderAll();
    else renderCity(data.cities.filter(function (c) { return c.id === h; })[0]);
    var sel = tabsEl.querySelector('[aria-selected="true"]');
    if (sel && sel.scrollIntoView) { try { sel.scrollIntoView({ block: 'nearest', inline: 'center' }); } catch (e) {} }
    window.scrollTo(0, 0);
  }

  var foot = document.getElementById('foot');

  window.addEventListener('hashchange', route);
  route();
})();
</script>
